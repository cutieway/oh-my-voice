name: oh-my-voice

# Qwen3-TTS Base batch voice-pack generation. The host only provides the
# amdgpu driver, /dev/kfd, /dev/dri, and Docker; Python/ROCm/torch live in the
# image. Runtime data is consolidated under ./data (gitignored).
#
#   mkdir -p data/{models,cache,refs,out}
#   export OMV_MISSES="$HOME/.xlcore/pluginConfigs/OhMyVoice/misses.jsonl"
#   export OMV_SANITIZER_PIN="v1:..."
#   docker compose build tts-qwen
#   docker compose run --rm tts-qwen
services:
  tts-qwen:
    build:
      context: ./tools/qwen
    image: oh-my-voice/tts-qwen:0.1.0
    user: "${OMV_UID:-1000}:${OMV_GID:-1000}"
    # gfx1200 compute. card1/video is not used; the render node is 0666.
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ${OMV_MISSES:?set OMV_MISSES to the plugin misses.jsonl}:/work/misses.jsonl:ro
      - ${OMV_VOICE_MAP:-./tools/voice-map.json}:/work/voice-map.json:ro
      - ${OMV_REFS:-./data/refs}:/refs:ro
      - ${OMV_OUT:-./data/out}:/out
      - ${OMV_CACHE:-./data/cache}:/cache
      - ${OMV_MODELS:-./data/models}:/models
    environment:
      HOME: /cache/home
      HF_HOME: /cache/hf
      TORCH_HOME: /cache/torch
      PYTHONUNBUFFERED: "1"
      HIP_VISIBLE_DEVICES: "0"
      OMV_QWEN_MODEL_DIR: /models/qwen3-tts/Qwen3-TTS-12Hz-1.7B-Base
      PIP_NO_CACHE_DIR: "1"
    command:
      - --misses
      - /work/misses.jsonl
      - --refs
      - /refs
      - --map
      - /work/voice-map.json
      - --out
      - /out
      - --lang
      - ${OMV_LANG:-en}
      - --qwen3-model
      - /models/qwen3-tts/Qwen3-TTS-12Hz-1.7B-Base
      - --sanitizer-pin
      - ${OMV_SANITIZER_PIN:?set OMV_SANITIZER_PIN from /omv Settings}
    stop_grace_period: 30s
