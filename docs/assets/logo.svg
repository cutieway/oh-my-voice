<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Oh My Voice logo: a speech bubble holding a hand-drawn ring around a pause mark, three handwritten lines fading toward a small heart, with a typing indicator below">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#1B121B"/>
      <stop offset=".5" stop-color="#120D13"/>
      <stop offset="1" stop-color="#0B090C"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF5FA2" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#D6338A" stop-opacity=".09"/>
      <stop offset="1" stop-color="#D6338A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB3D9"/>
      <stop offset=".5" stop-color="#FF7EB6"/>
      <stop offset="1" stop-color="#E8438C"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="4" y="4" width="232" height="232" rx="56"/></clipPath>
  </defs>

  <rect x="4" y="4" width="232" height="232" rx="56" fill="url(#bg)"/>

  <g clip-path="url(#tileClip)">
    <ellipse cx="120" cy="105" rx="120" ry="105" fill="url(#spot)"/>
  </g>

  <rect x="4.6" y="4.6" width="230.8" height="230.8" rx="55.4" fill="none" stroke="url(#edge)" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- speech bubble -->
  <g transform="translate(120 108) scale(1.35)">
    <ellipse cx="0" cy="50" rx="46" ry="6" fill="#000000" opacity=".3"/>
    <path d="M-34 10 L-18 56 L6 24 Z" fill="#FFF9FC"/>
    <rect x="-60" y="-52" width="120" height="88" rx="26" fill="#FFF9FC"/>

    <g transform="translate(0 -2.5)">
    <!-- hand-drawn ring around the pause mark -->
    <path d="M-45 -6 C-45 -17 -36 -25 -25 -25 C-14 -25 -6 -17 -5 -6 C-4 5 -13 14 -25 14 C-36 14 -44 5 -45 -6" fill="none" stroke="#B78DA4" stroke-width="2.2" stroke-linecap="round"/>

    <!-- pause icon: straight edges, rounded ends -->
    <rect x="-35" y="-18" width="7" height="24" rx="3.5" fill="#B78DA4" fill-opacity=".16" stroke="#B78DA4" stroke-width="2.2"/>
    <rect x="-22" y="-18" width="7" height="24" rx="3.5" fill="#B78DA4" fill-opacity=".16" stroke="#B78DA4" stroke-width="2.2"/>

    <!-- freehand dialogue lines -->
    <path d="M 0 -13 C 6 -16 10 -10 16 -13 C 22 -16 26 -10 32 -12 C 37 -13 40 -12 42 -10"
          fill="none" stroke="#B78DA4" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 0 -1 C 5 -4 9 1 14 -2 C 19 -5 23 0 27 -2 C 29 -3 30 -2 31 0"
          fill="none" stroke="#B78DA4" stroke-width="2" stroke-linecap="round" opacity=".55"/>
    <path d="M 0 5 C 6 3 10 6 15 6 C 20 6 22 7 23 9 C 24 12 26 15 30 16"
          fill="none" stroke="#B78DA4" stroke-width="1.8" stroke-linecap="round" opacity=".4"/>
    <path d="M 36 14 C 35 12 32 12 32 14 C 32 16 36 18 36 18 C 36 18 40 16 40 14 C 40 12 37 12 36 14 Z"
          fill="#E8438C" opacity=".8" transform="rotate(-8 36 15)"/>
    </g>
  </g>

  <!-- typing indicator in the free lower area -->
  <circle cx="104" cy="213" r="5.5" fill="#FFFFFF" opacity=".95"/>
  <circle cx="120" cy="213" r="5.5" fill="#FFFFFF" opacity=".6"/>
  <circle cx="136" cy="213" r="5.5" fill="#FFFFFF" opacity=".35"/>
</svg>
